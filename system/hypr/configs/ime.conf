# fcitx5 input method. Comment out the source line in hyprland.conf if
# you don't use an IME, or replace with ibus / kime / etc. as needed.
exec-once = fcitx5 -d --replace

# Only XMODIFIERS: XWayland clients still go through XIM, while Wayland ones
# use fcitx5's text-input frontend. Setting GTK_IM_MODULE forces GTK back onto
# the legacy module path, which fcitx5 warns about on startup.
env = XMODIFIERS,@im=fcitx
