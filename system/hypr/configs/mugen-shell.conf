# Autostart bits required by mugen-shell, for a config still written in hyprlang
# (the shipped one is Lua — see mugen-shell.lua). Opt in with one line:
#
#     source = ~/.config/hypr/configs/mugen-shell.conf

# Hand the compositor's address to systemd, then pull up the session target:
# graphical-session.target refuses a manual start, so user services bound to
# their behalf.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start mugen-shell-session.target
exec-once = sh -lc 'sleep 1; ~/.config/hypr/scripts/wallp-restore.sh'
# fcitx's Wayland frontend only reaches a surface Qt has activated, and a layer
# shell never becomes the application's focus window, so text input here has to
# go over fcitx's DBus frontend instead. Scoped to these two processes:
# exporting QT_IM_MODULE session-wide is what fcitx5 warns about.
# Qt picks no platform theme under XDG_CURRENT_DESKTOP=Hyprland, and without
# one its FileDialog is self-drawn rather than the desktop's.
exec-once = env QT_IM_MODULE=fcitx QT_QPA_PLATFORMTHEME=xdgdesktopportal quickshell -c mugen-shell
exec-once = env QT_IM_MODULE=fcitx QT_QPA_PLATFORMTHEME=xdgdesktopportal quickshell -p ~/.config/quickshell/mugen-shell/yura-shell.qml
exec-once = ~/.config/quickshell/mugen-shell/scripts/blur-preset.sh boot
exec-once = ~/.config/hypr/scripts/hypridle-auto-start.sh
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent

# Compositor settings the lock screen depends on. Without xray Hyprland primes
# the output black under the lock, so the face has nothing to fade against and
# the bar cannot morph into it.
# ⚠️ xray also means anything the lock surface leaves translucent shows the
# desktop. Turn it off if you make the face see-through.
misc {
    session_lock_xray = true
    # All-or-nothing and held for as long as the surface exists, so it cannot be
    # animated. The lock raises it itself while it is up.
    session_lock_blur = false
    # Without this a lock client that died cannot be replaced and the only way
    # back is a TTY: the second client is killed with "wl_display error".
    allow_session_lock_restore = true
}
