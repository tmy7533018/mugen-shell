# Autostart bits required by mugen-shell, for a config still written in hyprlang
# (the shipped one is Lua — see mugen-shell.lua). Opt in with one line:
#
#     source = ~/.config/hypr/configs/mugen-shell.conf

# One shell so the import lands first; graphical-session.target refuses a manual start, so the session target pulls it up.
# A bar that outlived the previous compositor keeps its address, and an active target won't pull one stuck at the start limit; a disabled bar stays off.
exec-once = sh -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && { systemctl --user reset-failed mugen-shell.service; systemctl --user try-restart mugen-shell.service; systemctl --user start mugen-shell-session.target; systemctl --user is-enabled --quiet mugen-shell.service && systemctl --user start mugen-shell.service; }'
exec-once = sh -lc 'sleep 1; ~/.config/quickshell/mugen-shell/scripts/wallp-restore.sh'
exec-once = ~/.config/quickshell/mugen-shell/scripts/yura-window.sh
exec-once = ~/.config/quickshell/mugen-shell/scripts/blur.sh boot
exec-once = ~/.config/hypr/scripts/hypridle-auto-start.sh
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent

# Compositor settings the lock screen depends on. Without xray Hyprland primes
# the output black under the lock, so the face has nothing to fade against and
# the bar cannot morph into it.
# ⚠️ xray also means anything the lock surface leaves translucent shows the
# desktop. Turn it off if you make the face see-through.
misc {
    session_lock_xray = true
    # All-or-nothing for the lock surface's whole life, so it cannot be animated; only a Lua config lets the lock raise it.
    session_lock_blur = false
    # Without this a lock client that died cannot be replaced and the only way
    # back is a TTY: the second client is killed with "wl_display error".
    allow_session_lock_restore = true
}
