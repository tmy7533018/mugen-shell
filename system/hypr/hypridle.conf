general {
    # Mode 2 only waits for the lock when the command string contains "hyprlock"; 3 asks for the wait outright.
    inhibit_sleep = 3
    lock_cmd = $HOME/.config/quickshell/mugen-shell/scripts/mugen-lock.sh
    before_sleep_cmd = $HOME/.config/quickshell/mugen-shell/scripts/mugen-lock.sh --instant
    after_sleep_cmd = $HOME/.config/quickshell/mugen-shell/scripts/dpms.sh on  # to avoid having to press a key twice to turn on the display.
}

# === LOCKSCREEN === (timeout managed via Settings → Screen Lock Timer)
listener {
    timeout = 600
    on-timeout = $HOME/.config/quickshell/mugen-shell/scripts/mugen-lock.sh
}

# === SUSPEND ===
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
