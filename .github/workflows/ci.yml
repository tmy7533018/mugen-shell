name: CI

# No QML job: its harness lives in the untracked dev/. Run dev/test-all.sh locally for that half.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Covers every install route in SETUP: the module, the demo VM, and home-manager.
      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build the packages
        run: nix build --print-build-logs .#mugen-ai .#mugen-shell .#mugen-audio

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # gofmt -l reports rather than exits non-zero, so turn its output into the failure.
      - name: Format
        run: |
          nix shell nixpkgs#go --command sh -c \
            'unformatted=$(gofmt -l .); [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }'
        working-directory: ai

      - name: Vet
        run: nix shell nixpkgs#go nixpkgs#gcc --command go vet ./...
        working-directory: ai

      # The SQLite driver needs cgo, so a C compiler has to come along.
      - name: Test
        run: nix shell nixpkgs#go nixpkgs#gcc --command go test ./...
        working-directory: ai

  arch:
    name: arch
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # makepkg refuses to run as root, so the build happens as `builder` throughout.
      - name: Bootstrap
        run: |
          # Upgrading archlinux-keyring runs a hook that fails on the image's uninitialised keyring.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Hand the checkout to the build user
        run: chown -R builder "$GITHUB_WORKSPACE"

      # libcava is the one makedepend that is not in the official repos.
      - name: Build libcava
        run: |
          sudo -u builder git clone https://aur.archlinux.org/libcava.git /tmp/libcava
          sudo -u builder sh -c 'cd /tmp/libcava && makepkg -si --noconfirm'

      # The build reads the checkout, so a git-ignored file must not reach the package.
      - name: Plant an ignored file
        run: sudo -u builder sh -c 'echo PERSONAL > system/hypr/configs/user-overrides.lua'

      - name: makepkg
        run: sudo -u builder sh -c 'cd arch/mugen-shell && makepkg -s --noconfirm'

      # A package that builds but ships nothing passes every other check.
      - name: Inspect the packages
        run: |
          cd arch/mugen-shell
          for p in *.pkg.tar.zst; do echo "=== $p ==="; bsdtar tf "$p"; done
          check() {
            bsdtar tf $1 | grep -qx "$2" || { echo "missing in $1: $2" >&2; exit 1; }
          }
          check 'mugen-audio-*.pkg.tar.zst' 'usr/lib/qt6/qml/Mugen/Audio/qmldir'
          check 'mugen-audio-*.pkg.tar.zst' 'usr/lib/qt6/qml/Mugen/Audio/libmugen-audio.so'
          check 'mugen-audio-*.pkg.tar.zst' 'usr/lib/qt6/qml/Mugen/Audio/libmugen-audioplugin.so'
          check 'mugen-ai-*.pkg.tar.zst'    'usr/bin/mugen-ai'
          check 'mugen-ai-*.pkg.tar.zst'    'usr/lib/systemd/user/mugen-ai.service'
          check 'mugen-ai-*.pkg.tar.zst'    'usr/share/mugen-ai/config.toml.example'
          check 'mugen-ai-*.pkg.tar.zst'    'usr/share/mugen-ai/.env.example'
          check 'mugen-ai-*.pkg.tar.zst'    'usr/lib/systemd/user/mugen-event-notifier.service'
          check 'mugen-ai-*.pkg.tar.zst'    'usr/lib/systemd/user/mugen-event-notifier.timer'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/bin/mugen-shell-session'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/bin/mugen-shell-sync'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/lib/systemd/user/mugen-shell.service'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/lib/systemd/user/mugen-shell-session.target'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/qml/shell.qml'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/qml/scripts/qs-ipc.sh'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/hypr/hyprland.lua'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/qml/scripts/wallp-restore.sh'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/qml/scripts/mpvpaper-opts.sh'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/matugen/config.toml'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/cava/config'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/kitty/kitty.conf'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/fastfetch/config.jsonc'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/starship.toml'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/gtk/gtk.css'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/mugen-shell/zsh/mugen-shell.zshrc'
          check 'mugen-shell-*.pkg.tar.zst' 'usr/share/wayland-sessions/mugen-shell.desktop'
          check 'mugen-shell-*.pkg.tar.zst' 'etc/pam.d/mugen-lock'
          absent() {
            bsdtar tf $1 | grep -q "$2" && { echo "$1 ships an ignored file: $2" >&2; exit 1; }
            true
          }
          absent 'mugen-shell-*.pkg.tar.zst' 'user-overrides.lua'
          absent 'mugen-shell-*.pkg.tar.zst' 'test-shell.qml'
          executable() {
            bsdtar tvf $1 | awk -v pkg="$1" -v re="$2" '/^-/ && $NF ~ re && substr($1, 4, 1) != "x" { print "not executable in " pkg ": " $NF; bad = 1 } END { exit bad }' >&2 || exit 1
          }
          executable 'mugen-shell-*.pkg.tar.zst' '^usr/share/mugen-shell/(qml|hypr)/scripts/'

